name: Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.33.4"
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch deploys the selected environment; branch pushes map
      # main -> production and staging -> staging.
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Refuse to deploy a non-main ref to production
        if: env.DEPLOY_ENV == 'production' && github.ref_name != 'main'
        run: |
          echo "::error::Production deploys must come from main (got ${{ github.ref_name }})."
          exit 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deploy runs in parallel with the CI workflow on a push to main, so it
      # re-runs the same gates itself rather than trusting a race.
      - run: pnpm lint
      - run: pnpm --filter @repo/web routes:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Apply D1 migrations
        run: pnpm --filter @repo/db db:migrate:remote ${{ env.DEPLOY_ENV == 'staging' && '--env staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: apps/web
        run: |
          DEPLOY_OUTPUT=$(pnpm exec wrangler deploy \
            ${{ env.DEPLOY_ENV == 'staging' && '--env staging' || '' }} \
            2>&1)
          echo "$DEPLOY_OUTPUT"

          URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract a deployment URL from wrangler output."
            exit 1
          fi
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health Check
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Checking health at $URL/api/health..."
          for i in 1 2 3; do
            STATUS=$(curl -sf "$URL/api/health" | jq -r '.status' 2>/dev/null || echo "fail")
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 3 attempts"
          exit 1

  # Uploads a preview version (not deployed) for same-repo PRs. Fork PRs are
  # skipped — they don't receive the Cloudflare secrets.
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Upload preview version
        working-directory: apps/web
        run: pnpm exec wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
